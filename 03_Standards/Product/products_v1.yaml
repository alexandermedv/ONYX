# Documentation contract only. Existing persisted order_statuses above remain unchanged.
order_lifecycle_policy:
  implementation_status: DOCUMENTATION_ONLY
  closure_event: CLOSED
  retention_clock_starts_at: order_closed_at
  canonical_operational_states:
  - INTAKE
  - WAITING_FOR_REFERENCES
  - REFERENCE_QA
  - READY_FOR_PAYMENT
  - PAID
  - IN_PRODUCTION
  - IN_QA
  - WAITING_FOR_CLIENT_CORRECTION
  - READY_FOR_DELIVERY
  - DELIVERED
  - CLOSED
  terminal_resolution_statuses:
  - REFUNDED
  - CANCELLED
  legacy_mapping_authority: ONYX_SERVICE_STANDARD_v1.md
  metadata_fields:
    order_closed_at: timezone-aware timestamp; set only after delivery or cancellation/refund resolution.
    retention_until: order_closed_at plus 30 calendar days in the order timezone.
    deletion_status: [PENDING, PARTIAL_EXTERNAL_LIMITATION, HOLD, COMPLETE]
    deleted_at: timestamp when eligible active-workspace deletion is completed.
    payment_status: [NOT_DUE, DUE, PAID, REFUND_PENDING, PARTIALLY_REFUNDED, REFUNDED]
    refund_status: [NOT_APPLICABLE, REVIEW, AGREED, PROCESSING, PARTIALLY_REFUNDED, REFUNDED]
    resolution_status: [FULFILLED, CANCELLED, REFUNDED, PARTIALLY_FULFILLED, OPEN]
    marketing_consent: [GRANTED, DENIED, NOT_ASKED]
  metrics_after_image_deletion:
  - order_id
  - product_id
  - dates_and_status
  - amount_and_payment_refund_facts
  - consent_status
  - minimal_operational_qa
  - anonymized_production_metrics
