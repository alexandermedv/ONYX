payment_policy:
  prepayment_percent: 100
  after_reference_qa: true
  feasibility_and_capacity_required: true
  flow:
  - REFERENCES_SUBMITTED
  - REFERENCE_QA_PASS_OR_AGREED_NOTES
  - FEASIBILITY_CONFIRMED
  - FINAL_SCOPE_PRICE_DEADLINE_CONFIRMED
  - PREPAYMENT_RECEIVED_AND_RECORDED
  - PRODUCTION_STARTS
  priority_express:
    capacity_confirmation_before_quote: true
    surcharge_and_deadline_acceptance_before_payment: true
    payment_before_urgent_production: true
    do_not_sell_without_target_capacity: true
  cancellation_before_production:
    default: FULL_REFUND_OF_AMOUNT_RECEIVED
    automatic_deductions: false
  cancellation_after_production:
    basis:
    - work_actually_performed
    - direct_costs_actually_incurred
    - production_stage
    - applicable_requirements
    owner_case_review: true
    fixed_forfeiture: false
  failed_order:
    default_resolution: REFUND_FOR_UNFULFILLED_SCOPE
    individual_bad_images: REGENERATE_REPLACE_OR_REPAIR
  refund_record_fields:
  - refund_status
  - refund_amount
  - refund_date
  - refund_channel_or_reference
  - client_confirmation
