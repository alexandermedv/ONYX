  "copy": [
    {
      "file": "05_marketing/05_copy/avito_description_v1_publish.md",
      "sha256": "9bbe95cc77d4af1d742937032322d88051e07a75de49c3bcd09b83ed4fc01651",
      "text": "# Виртуальная деловая фотосессия ONYX\n\nДесять кадров, объединённых одним образом. Крупный портрет, рабочий кабинет, переговорная, движение и полный рост.\n\nПродуманная серия помогает подобрать фотографию под настроение и задачу. В основе подхода — концепция, внимание к внешности, разнообразие сцен и аккуратный отбор.\n\nДля резюме, LinkedIn, сайта и социальных сетей — без поездки в студию.\n\nРасскажите, какой образ вы хотите создать и где планируете использовать фотографии.\n"
    },
    {
      "file": "05_marketing/05_copy/website_business_collection_v1_publish.md",
      "sha256": "0473548b0e3bf3aca474a121bb8f76cfc90437c383d4d6c9fdc231f83919b227",
      "text": "# ONYX Business\n\nОдин образ — разные моменты. Крупный портрет, рабочий кабинет, переговорная, движение и полный рост.\n\nКоллекция объединяет десять фотографий с разными планами, ракурсами и настроением. Виртуальная фотосессия открывает новые возможности для личного визуального образа.\n"
    },
    {
      "file": "05_marketing/05_copy/short_social_caption_v1_publish.md",
      "sha256": "f509fc258ae4264919895718e79bcfa1e646127305eb19ad057a4d0b48bd926e",
      "text": "ONYX Business: десять кадров, один образ, разные истории. Крупный портрет, рабочий кабинет, переговорная, движение и полный рост.\n\nВиртуальная фотосессия ONYX.\n"
    },
