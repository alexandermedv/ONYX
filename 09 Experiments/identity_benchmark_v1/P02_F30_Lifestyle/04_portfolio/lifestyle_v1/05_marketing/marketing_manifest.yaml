      "sha256": "b045c144f25f3424fe34eba8f03115a8f86ca9a68bbde69678a3b06d9a0c6e92",
      "text": "# Виртуальная lifestyle фотосессия ONYX\n\nДесять кадров, объединённых одним образом. Утреннее кафе, прогулка по городу, уютный дом, закат на крыше и вечерняя улица.\n\nПродуманная серия помогает подобрать фотографию под настроение и задачу. В основе подхода — концепция, внимание к внешности, разнообразие сцен и аккуратный отбор.\n\nДля личного бренда, социальных сетей и истории о себе — без поездки в студию.\n\nРасскажите, какой образ вы хотите создать и где планируете использовать фотографии.\n"
    },
    {
      "file": "05_marketing/05_copy/website_lifestyle_collection_v1.md",
      "sha256": "dcc9c13391ec8369f3613952686b1452aaabeee8abf9fe7ba9452cf1e3ae7221",
      "text": "# ONYX Lifestyle\n\nОдин образ — разные моменты. Утреннее кафе, прогулка по городу, уютный дом, закат на крыше и вечерняя улица.\n\nКоллекция объединяет десять фотографий с разными планами, ракурсами и настроением. Виртуальная фотосессия открывает новые возможности для личного визуального образа.\n"
    },
    {
      "file": "05_marketing/05_copy/short_social_caption_v1.md",
